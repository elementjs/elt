<!doctype html>
<html>
	<head>
		<meta charset='utf-8'>
		<!-- Force using Edge over IE -->
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

		<!-- App support -->
		<meta name="viewport" content="width=device-width, user-scalable=no" />

		<!-- Home Screen Support -->
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-touch-fullscreen" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black translucent">

		<!-- Google fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- IBM Plex Sans: the default theme font (ui/theme.tsx), which uses weights 400 to 700; the
             variable font covers them in one file per style. IBM Plex Mono: the theme's monospace font
             (code, kbd), not a variable font, so each weight is listed: 400 (code), 500 (kbd), 600 and 700
             (code inside dt/summary, headings and strong), 400 italic (code inside em). The browser
             downloads only the weights the page actually uses. Public Sans: one of the fonts
             docs/md/visual-test.md compares. -->
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	</head>

	<body>
		<script type="module" src="./src/app.tsx"></script>
	</body>

</html>
